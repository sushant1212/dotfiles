# Shadows
shadow = false;
shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = -12;
shadow-offset-y = -12;

# Transparency/opacity
inactive-opacity = 0.8;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Corners (needs a build with corner-radius support - check picom --version output)
corner-radius = 6;
rounded-corners-exclude = [
  "class_g = 'polybar'"
];


# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

# Backend - "glx" is the modern GPU-accelerated one
backend = "glx";
vsync = true;

# Don't apply effects to some window types
shadow-exclude = [
  "class_g = 'polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];
