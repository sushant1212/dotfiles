;=============================================================================
; polybar config for i3 -- safe to hand-edit.
;
; The only real trap: every icon here is a literal UTF-8 Nerd Font glyph
; (JetBrainsMono Nerd Font v3, Material Design range). Never write \uXXXX
; escapes -- polybar's parser does not interpret them and prints them
; literally. If your editor or clipboard strips a glyph, copy an existing one
; from elsewhere in this file rather than retyping it.
;=============================================================================

;=== colors ==================================================================
; Placeholder dark scheme. Retheme the whole bar by editing values here only;
; every module references these by variable and hardcodes no hex value.
[colors]
background     = #161616
background-alt = #282828
foreground     = #f2f4f8
foreground-alt = #c1c7cd
disabled       = #6f6f6f
primary        = #78a9ff
secondary      = #25be6a
alert          = #ee5396
; semantic names used by the modules below
accent         = #78a9ff
yellow         = #f1ff5e
red            = #ee5396
green          = #25be6a
mauve          = #be95ff
teal           = #3ddbd9
peach          = #ff7eb6


;=== bar =====================================================================
[bar/main]
bottom = false
width = 100%
height = 28
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3
line-color = ${colors.accent}

border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1

; JetBrainsMono Nerd Font carries both text and every icon glyph used here, so
; no separate symbol font is needed. font-1 is a mono-variant fallback.
font-0 = "JetBrainsMono Nerd Font:style=Regular:size=10;2"
font-1 = "JetBrainsMono Nerd Font Mono:style=Regular:size=13;3"

modules-left = i3
modules-center = date
modules-right = network cpu memory pulseaudio battery tray

separator =
cursor-click = pointer
cursor-scroll = default
enable-ipc = true

; i3 reserves space for the bar via EWMH struts, so no wm-restack is needed
; here; setting it with override-redirect = false only logs a warning.
override-redirect = false

;=== i3 workspaces ===========================================================
[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 2
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.yellow}

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.accent}
label-focused-underline = ${colors.accent}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.disabled}
label-unfocused-padding = 2

label-visible = %name%
label-visible-foreground = ${colors.foreground-alt}
label-visible-padding = 2

label-urgent = %name%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.red}
label-urgent-padding = 2

;=== clock ===================================================================
[module/date]
type = internal/date
interval = 1
; Always the full expanded form. date-alt is deliberately NOT set: defining it
; is what makes internal/date toggle formats when clicked, so leaving it out
; makes the module completely unclickable.
date = %A, %d %B %Y   %H:%M:%S
format = <label>
label = %date%
label-foreground = ${colors.foreground}

;=== network =================================================================
; nm-applet already shows wifi + bluetooth in the tray, so the SSID is left out
; here instead of being duplicated. What this module adds is the IP address --
; which the applet does not surface -- plus throughput.
[module/network]
type = internal/network
interface = wlp3s0
interval = 2
unknown-as-up = true
speed-unit = B/s
accumulate-stats = true

; %downspeed:9% / %upspeed:9% set a minimum token width so the bar does not
; jitter as the speed text changes length (replaces deprecated
; udspeed-minwidth).
format-connected = <label-connected>
format-connected-prefix = "󰌗 "
format-connected-prefix-foreground = ${colors.accent}
label-connected = "%local_ip%  󰁅 %downspeed:9%  󰁝 %upspeed:9%"
label-connected-foreground = ${colors.foreground}

format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰖪 "
format-disconnected-prefix-foreground = ${colors.disabled}
label-disconnected = offline
label-disconnected-foreground = ${colors.disabled}

; opens the GUI wifi picker
click-left = nm-connection-editor

;=== cpu =====================================================================
[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = "󰱛 "
format-prefix-foreground = ${colors.mauve}
label = %percentage:2%%
label-foreground = ${colors.foreground}

;=== memory ==================================================================
[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.teal}
label = %percentage_used:2%%
label-foreground = ${colors.foreground}

;=== volume ==================================================================
[module/pulseaudio]
type = internal/pulseaudio
interval = 5
use-ui-max = false

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage:3%%
label-volume-foreground = ${colors.foreground}

ramp-volume-0 = "󰕿"
ramp-volume-1 = "󰖀"
ramp-volume-2 = "󰕾"
ramp-volume-foreground = ${colors.peach}

format-muted = <label-muted>
label-muted = "󰖁 muted"
label-muted-foreground = ${colors.disabled}

click-right = pavucontrol
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

;=== battery =================================================================
; BAT0 / AC verified present under /sys/class/power_supply.
; Discharging uses a 10-stage level ramp. Charging / full / low are plain
; static icons -- no animated frames anywhere.
[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
low-at = 15
poll-interval = 5

format-charging = <label-charging>
label-charging = "󰚥 %percentage%%"
label-charging-foreground = ${colors.green}

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
label-discharging-foreground = ${colors.foreground}

format-full = <label-full>
label-full = "󰚥 %percentage%%"
label-full-foreground = ${colors.green}

format-low = <label-low>
label-low = "󰂃 %percentage%%"
label-low-foreground = ${colors.red}

ramp-capacity-0 = "󰂎"
ramp-capacity-1 = "󰁺"
ramp-capacity-2 = "󰁻"
ramp-capacity-3 = "󰁼"
ramp-capacity-4 = "󰁽"
ramp-capacity-5 = "󰁾"
ramp-capacity-6 = "󰁿"
ramp-capacity-7 = "󰂀"
ramp-capacity-8 = "󰂁"
ramp-capacity-9 = "󰂂"
ramp-capacity-10 = "󰁹"
ramp-capacity-0-foreground = ${colors.red}
ramp-capacity-1-foreground = ${colors.red}
ramp-capacity-2-foreground = ${colors.peach}
ramp-capacity-3-foreground = ${colors.peach}
ramp-capacity-4-foreground = ${colors.yellow}
ramp-capacity-5-foreground = ${colors.yellow}
ramp-capacity-6-foreground = ${colors.green}
ramp-capacity-7-foreground = ${colors.green}
ramp-capacity-8-foreground = ${colors.green}
ramp-capacity-9-foreground = ${colors.green}
ramp-capacity-10-foreground = ${colors.green}



;=== system tray (nm-applet, bluetooth, etc.) ================================
; polybar 3.7 replaced bar/main.tray-position with this dedicated module; the
; old bar-level tray-* keys still work but log a deprecation warning.
[module/tray]
type = internal/tray
tray-spacing = 4px
tray-padding = 2px

;=== settings ================================================================
[settings]
screenchange-reload = true
pseudo-transparency = false
